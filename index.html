<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snecko</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <style>
      body {
        margin: 0;
        background: #0f0f23;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 16px;
      }
      canvas {
        image-rendering: pixelated;
      }

      /* --- Pixel-art logo (CSS box-shadow) --- */
      .snecko-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .snecko-title {
        font-family: monospace;
        font-size: 18px;
        letter-spacing: 6px;
        color: #cbdbfc;
      }
      .snecko-version {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 2px;
        color: #6a7a9a;
        margin-top: 2px;
      }
      .snecko-logo {
        --px: 5px;
        position: relative;
        width: calc(var(--px) * 9);
        height: calc(var(--px) * 9);
        animation: breathe 3s ease-in-out infinite;
        transition: transform 0.4s ease-in;
      }
      .snecko-logo::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: var(--px);
        height: var(--px);
        box-shadow:
          /* Row 0: tongue upper fork tip */
          calc(var(--px) * 0) calc(var(--px) * 0) 0 0 #e74c3c,
          /* Row 1: tongue curves in */ calc(var(--px) * 1) calc(var(--px) * 1) 0 0 #e74c3c,
          /* Row 2: tongue meets head + top bar */ calc(var(--px) * 2) calc(var(--px) * 2) 0 0
            #e74c3c,
          calc(var(--px) * 3) calc(var(--px) * 2) 0 0 #80f0ff,
          calc(var(--px) * 4) calc(var(--px) * 2) 0 0 #16162a,
          calc(var(--px) * 5) calc(var(--px) * 2) 0 0 #80f0ff,
          calc(var(--px) * 6) calc(var(--px) * 2) 0 0 #00e5ff,
          calc(var(--px) * 7) calc(var(--px) * 2) 0 0 #00e5ff,
          calc(var(--px) * 8) calc(var(--px) * 2) 0 0 #00e5ff,
          /* Row 3: tongue lower fork + top bar */ calc(var(--px) * 1) calc(var(--px) * 3) 0 0
            #e74c3c,
          calc(var(--px) * 3) calc(var(--px) * 3) 0 0 #80f0ff,
          calc(var(--px) * 4) calc(var(--px) * 3) 0 0 #00e5ff,
          calc(var(--px) * 5) calc(var(--px) * 3) 0 0 #00e5ff,
          calc(var(--px) * 6) calc(var(--px) * 3) 0 0 #00e5ff,
          calc(var(--px) * 7) calc(var(--px) * 3) 0 0 #00e5ff,
          calc(var(--px) * 8) calc(var(--px) * 3) 0 0 #00e5ff,
          /* Row 4: tongue lower tip + diagonal */ calc(var(--px) * 0) calc(var(--px) * 4) 0 0
            #e74c3c,
          calc(var(--px) * 7) calc(var(--px) * 4) 0 0 #00e5ff,
          calc(var(--px) * 8) calc(var(--px) * 4) 0 0 #00e5ff,
          /* Row 5: diagonal */ calc(var(--px) * 6) calc(var(--px) * 5) 0 0 #00e5ff,
          calc(var(--px) * 7) calc(var(--px) * 5) 0 0 #00e5ff,
          /* Row 6: diagonal */ calc(var(--px) * 5) calc(var(--px) * 6) 0 0 #00e5ff,
          calc(var(--px) * 6) calc(var(--px) * 6) 0 0 #00e5ff,
          /* Row 7: bottom bar */ calc(var(--px) * 4) calc(var(--px) * 7) 0 0 #00e5ff,
          calc(var(--px) * 5) calc(var(--px) * 7) 0 0 #00e5ff,
          calc(var(--px) * 6) calc(var(--px) * 7) 0 0 #00e5ff,
          calc(var(--px) * 7) calc(var(--px) * 7) 0 0 #00e5ff,
          calc(var(--px) * 8) calc(var(--px) * 7) 0 0 #00e5ff,
          /* Row 8: bottom bar + tail */ calc(var(--px) * 4) calc(var(--px) * 8) 0 0 #00e5ff,
          calc(var(--px) * 5) calc(var(--px) * 8) 0 0 #00e5ff,
          calc(var(--px) * 6) calc(var(--px) * 8) 0 0 #00e5ff,
          calc(var(--px) * 7) calc(var(--px) * 8) 0 0 #00e5ff,
          calc(var(--px) * 8) calc(var(--px) * 8) 0 0 #00b8d4;
      }
      .snecko-logo.excited {
        animation: excited 0.15s ease-in-out 4;
      }
      .snecko-logo.dead {
        animation: none;
        transform: rotate(-90deg) translateY(4px);
      }

      /* --- Sir Reginald Caw panel (brood mutation) --- */
      /* Same width as the game canvas (620 px = 31 cells × 20 px) so
         appearing speech bubbles never reflow the layout. The sprite
         sits on the right; bubbles render to its left, on the same
         canvas, with a tail pointing at the beak. */
      .reginald-panel {
        display: none;
        image-rendering: pixelated;
      }
      body.state-brood .snecko-logo {
        display: none;
      }
      body.state-brood .reginald-panel {
        display: block;
      }
      /* Speaking bob — reuses the same `excited` keyframes as the
         snecko logo (four short hops). Applied in main.browser.js when
         a non-pity line first appears. */
      .reginald-panel.excited {
        animation: excited 0.15s ease-in-out 4;
      }

      @keyframes breathe {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }
      @keyframes excited {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
    </style>
  </head>
  <body>
    <div class="snecko-header">
      <div class="snecko-logo" id="logo"></div>
      <canvas class="reginald-panel" id="reginald-panel" width="620" height="112"></canvas>
      <div class="snecko-title">SNECKO</div>
      <div class="snecko-version" id="snecko-version"></div>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="src/main.browser.js"></script>
  </body>
</html>
